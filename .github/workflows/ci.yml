name: CI

on:
  push:
    branches: [main, portfolio-polish]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q modules scripts
      - name: Run API and memory tests
        run: pytest -q modules/evaluation_and_testing/tests

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/frontend_chat_interface/el_consulto_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: modules/frontend_chat_interface/el_consulto_frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
